name: Full stack checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: meetintel
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: meetintel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U meetintel -d meetintel"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: renderer/package-lock.json
      - run: pip install -r backend/requirements.txt -c backend/requirements-lock.txt
      - run: python -m unittest discover -s backend -p 'test_*.py'
        env:
          TEST_DATABASE_URL: postgresql+psycopg://meetintel:integration-only@localhost:5432/meetintel
      - run: npm ci --prefix renderer && npm run build --prefix renderer
      - run: python deployment/setup.py
      - run: docker compose config --quiet && docker compose up --build -d --wait
      - name: Verify gateway requires authentication
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost)" = "401"
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail 100
      - name: Stop stack
        if: always()
        run: docker compose down
